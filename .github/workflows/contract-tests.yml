# Dogfood: run this repo's example suites through the composite action.
# Built from source, because a PR may add suites that use runner features
# newer than the latest release (other projects use `version: latest` or a
# tag; that path is exercised by the release workflow's assets).
name: contract-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/test
        with:
          suites: "examples/tests/*.test.json"
          version: source
