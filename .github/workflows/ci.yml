# The verification bar, enforced. Everything the plan calls a "floor" or a
# "bar" runs here: fmt, clippy with warnings denied (with and without
# `cost-trace`), the workspace tests, and — because the node checkout is laid
# out as a sibling at the exact rev the workspace pins — the whole-corpus
# round-trip floors that would otherwise only run on a developer machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_TARGET_DIR: ./target-p00
  # Optimize the test hot paths without losing debug assertions or overflow
  # checks (including in dependencies). Tests inherit dev; the CLI replay
  # helper's `cargo build` must use the same settings. Keep release gates too.
  CARGO_PROFILE_DEV_OPT_LEVEL: '3'
  CARGO_PROFILE_DEV_DEBUG_ASSERTIONS: 'true'
  CARGO_PROFILE_DEV_OVERFLOW_CHECKS: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ergo-forge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The scoreboard verifies baseline artifacts at the plan's baseline
          # revision, so that commit must be in the runner's history.
          fetch-depth: 0
          path: ergo-forge

      - name: Read the pinned engine rev
        id: pin
        working-directory: ergo-forge
        run: |
          rev=$(grep -m1 -oE 'ergo-sigma *= *\{[^}]*rev *= *"[0-9a-f]+"' Cargo.toml | grep -oE '[0-9a-f]{40}')
          test -n "$rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # The corpus tests look for `../../ergo` relative to ergo-sandbox, i.e. a
      # sibling of this repo. Same rev as the crates, so the corpora match.
      - name: Checkout the node as a sibling (test corpora)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: arkadianet/ergo
          ref: ${{ steps.pin.outputs.rev }}
          path: ergo

      # Resolved from upstream refs/heads/stable; this action has no stable tag.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-03)
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Cache both debug and release dependencies in the actual target dir.
          workspaces: ergo-forge -> target-p00

      # Workspace Rust tests invoke Node DOM tests; install before verification.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ergo-forge/ui/package-lock.json

      - name: Install DOM test dependency
        working-directory: ergo-forge
        run: npm ci --prefix ui

      - name: fmt
        working-directory: ergo-forge
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: ergo-forge
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: clippy (cost-trace)
        working-directory: ergo-forge
        run: cargo clippy -p ergo-sandbox --all-targets --features cost-trace -- -D warnings

      - name: test
        working-directory: ergo-forge
        run: cargo test --workspace

      - name: test (cost-trace)
        working-directory: ergo-forge
        run: cargo test -p ergo-sandbox --features cost-trace

      - name: Governing roadmap completed prefix
        working-directory: ergo-forge
        run: |
          python3 scripts/roadmap_gate.py --through-completed
          # Final governing unit and the complete finite plan.
          python3 scripts/roadmap_gate.py --require P08
          python3 scripts/roadmap_gate.py --all-goals
